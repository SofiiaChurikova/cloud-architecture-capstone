openapi: 3.0.3
info:
  title: KV store - coordinator API
  version: "m5"
  description: >-
    Public API of the key-value store (M5). Clients talk only to the coordinator.
    The ring picks the shard, writes go to the leader of the shard,
    reads ask R replicas of the shard and return the newest version (last write wins).
    When the coordinator has API_TOKEN set, every /tables request needs
    "Authorization: Bearer <token>", otherwise 401.
    Every response has X-Trace-Id (taken from the request or new).
servers:
  - url: http://localhost:8080
security:
  - token: []

paths:
  /tables:
    get:
      summary: List tables
      responses:
        "200":
          description: All tables, sorted by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Table"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tables/{table}:
    parameters:
      - $ref: "#/components/parameters/table"
    put:
      summary: Create a table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableInput"
      responses:
        "200":
          description: Table created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "400":
          description: Body is not valid
        "409":
          description: Table already exists
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      summary: Get a table definition
      responses:
        "200":
          description: Table definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "404":
          description: Table not found
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tables/{table}/items/{key}:
    parameters:
      - $ref: "#/components/parameters/table"
      - name: key
        in: path
        required: true
        description: Value of the partition key
        schema:
          type: string
    put:
      summary: CREATE - put an item (overwrites if it exists)
      parameters:
        - $ref: "#/components/parameters/w"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Item"
      responses:
        "200":
          description: Item stored on W replicas
          headers:
            X-Version:
              $ref: "#/components/headers/X-Version"
        "400":
          description: Body is not a JSON object, or w / r is not 1-3
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Table not found
        "503":
          description: The shards are not registered yet, the leader is down, or fewer than W replicas confirmed (the write can still be in the leader log)
    get:
      summary: READ - get an item
      parameters:
        - $ref: "#/components/parameters/r"
      responses:
        "200":
          description: The item
          headers:
            X-Shard-Id:
              description: Which shard has the key (missing in single-node mode)
              schema:
                type: string
            X-Replicas:
              description: Which replicas answered, comma separated
              schema:
                type: string
            X-Version:
              $ref: "#/components/headers/X-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          description: Table or item not found
        "503":
          description: The shards are not registered yet, fewer than R replicas answered, or the key is moving and the old shard did not answer
        "401":
          $ref: "#/components/responses/Unauthorized"
    head:
      summary: EXISTS - check if an item exists
      parameters:
        - $ref: "#/components/parameters/r"
      responses:
        "200":
          description: Item exists
        "404":
          description: Table or item not found
        "503":
          description: The shards are not registered yet, fewer than R replicas answered, or the key is moving and the old shard did not answer
    delete:
      summary: DELETE - delete an item
      parameters:
        - $ref: "#/components/parameters/w"
      responses:
        "204":
          description: Item deleted (or didn't exist)
        "404":
          description: Table not found
        "503":
          description: The shards are not registered yet, the leader is down, or fewer than W replicas confirmed (the write can still be in the leader log)

  /admin/shards/{id}/drain:
    post:
      summary: Move all keys of a shard to the other shards and take it off the ring (the autoscaler calls it before removing shard instances)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: shard-2
      responses:
        "202":
          description: The move started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Migration"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The shard is not on the ring
        "409":
          description: Another move is running, or it is the last shard

  /admin/migration:
    get:
      summary: State of the current shard move and the last finished one
      responses:
        "200":
          description: Move state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Migration"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /version:
    get:
      summary: Build version (git commit), also on the replicas and the internal port
      security: []
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: coordinator
                  version:
                    type: string
                    example: 3f2a9c1

  /internal/targets:
    get:
      summary: Replicas for Prometheus (HTTP service discovery format), internal port 9080 only
      security: []
      responses:
        "200":
          description: One target per replica with shard and replica labels
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    targets:
                      type: array
                      items:
                        type: string
                      example: ["10.20.16.10:8081"]
                    labels:
                      type: object
                      example: {shard: shard-1, replica: shard-1-a}

  /metrics:
    get:
      summary: Metrics in the Prometheus text format, internal port 9080 only
      security: []
      responses:
        "200":
          description: kv_requests_total, kv_request_duration_seconds, kv_replicas_alive

  /internal/shards:
    post:
      summary: Register a replica, every replica calls it every 2 s as a heartbeat (internal port 9080 only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Replica"
      responses:
        "200":
          description: Replica registered. A new shard goes on the ring when all 3 of its replicas are alive
        "400":
          description: Body is not valid (ids must match ^[a-z0-9-]{1,32}$, addr must be http://host:port)
        "403":
          description: The shard ID is not in ALLOWED_SHARDS
        "410":
          description: The shard was drained; its old replicas can't come back
    get:
      summary: List shards and their replicas (internal port 9080 only)
      responses:
        "200":
          description: Shards on the ring with their replicas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shard"

  /health:
    get:
      summary: Health check - shards on the ring, registered replicas, move state, version
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                  shards: {type: integer}
                  replicas: {type: integer}
                  migration: {type: string, description: "idle, adding or draining"}
                  move: {$ref: "#/components/schemas/Migration"}
                  version: {type: string}

components:
  headers:
    X-Version:
      description: Version of the item = time of its last write on the leader, in microseconds, always growing. The greater version wins
      schema:
        type: integer
  securitySchemes:
    token:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: API_TOKEN is set and the token is missing or wrong
  parameters:
    w:
      name: w
      in: query
      required: false
      description: How many replicas must have a write before it is committed (default 2)
      schema:
        type: integer
        minimum: 1
        maximum: 3
    r:
      name: r
      in: query
      required: false
      description: How many replicas a read asks (default 2)
      schema:
        type: integer
        minimum: 1
        maximum: 3
    table:
      name: table
      in: path
      required: true
      schema:
        type: string
  schemas:
    TableInput:
      type: object
      required: [partition_key]
      properties:
        partition_key:
          type: string
          example: id
    Table:
      type: object
      properties:
        name:
          type: string
          example: users
        partition_key:
          type: string
          example: id
    Item:
      type: object
      additionalProperties: true
      example:
        name: Ann
        age: 21
    Replica:
      type: object
      required: [id, replica, role, addr]
      properties:
        id:
          type: string
          example: shard-1
        replica:
          type: string
          example: shard-1-a
        role:
          type: string
          enum: [leader, follower]
        addr:
          type: string
          example: http://10.20.16.10:8081
        offset:
          type: integer
          description: Last offset in the replica's log. A removed shard ID is accepted again only with offset 0
        alive:
          type: boolean
          readOnly: true
          description: false if the replica sent no heartbeat for 6 s
    Migration:
      type: object
      properties:
        state:
          type: string
          enum: [idle, adding, draining]
        shard:
          type: string
          example: shard-2
        copied:
          type: integer
        total:
          type: integer
        last:
          type: object
          description: The last finished move (same fields)
    Shard:
      type: object
      properties:
        id:
          type: string
          example: shard-1
        replicas:
          type: array
          items:
            $ref: "#/components/schemas/Replica"
