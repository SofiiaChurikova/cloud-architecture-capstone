groups:
  - name: kvstore
    rules:
      - alert: NodeDown
        expr: up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} {{ $labels.replica }} ({{ $labels.instance }}) does not answer"

      - alert: ShardMissingReplicas
        expr: kv_replicas_alive < 3
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.shard }} has {{ $value }} of 3 replicas alive"

      - alert: HighErrorRate
        expr: |
          (sum(rate(kv_requests_total{job="coordinator", status=~"5.."}[5m])) or vector(0))
            / sum(rate(kv_requests_total{job="coordinator"}[5m])) > 0.005
          and sum(rate(kv_requests_total{job="coordinator"}[5m])) > 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value | humanizePercentage }} of requests got 5xx, SLO allows 0.5%"

      - alert: HighReadLatency
        expr: |
          histogram_quantile(0.99, sum by (le) (rate(kv_request_duration_seconds_bucket{job="coordinator", op="read"}[5m]))) > 0.02
          and sum(rate(kv_request_duration_seconds_count{job="coordinator", op="read"}[5m])) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "read p99 is {{ $value | humanizeDuration }}, SLO is 20ms"

      - alert: HighWriteLatency
        expr: |
          histogram_quantile(0.99, sum by (le) (rate(kv_request_duration_seconds_bucket{job="coordinator", op=~"write|delete"}[5m]))) > 0.1
          and sum(rate(kv_request_duration_seconds_count{job="coordinator", op=~"write|delete"}[5m])) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "write p99 is {{ $value | humanizeDuration }}, SLO is 100ms"

      - alert: ReplicationLag
        expr: max by (shard, follower) (kv_replication_lag_seconds) > 5
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.follower }} is {{ $value | humanizeDuration }} behind its leader"
