global:
  scrape_interval: 10s
  scrape_timeout: 3s
  evaluation_interval: 10s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: coordinator
    static_configs:
      - targets: ["coordinator:9080"]

  - job_name: replicas
    http_sd_configs:
      - url: http://coordinator:9080/internal/targets
        refresh_interval: 15s
