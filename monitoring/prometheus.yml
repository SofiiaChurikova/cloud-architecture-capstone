global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: coordinator
    static_configs:
      - targets: ["coordinator:8080"]

  - job_name: replicas
    http_sd_configs:
      - url: http://coordinator:8080/internal/targets
        refresh_interval: 15s
