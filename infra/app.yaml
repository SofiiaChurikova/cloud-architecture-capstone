AWSTemplateFormatVersion: "2010-09-09"
Description: M4 app - 1 coordinator and 1 monitoring node in public subnets, 2 shards x 3 replicas in the private subnets

Parameters:
  NetworkStackName:
    Type: String
    Default: capstone-network
  CoordinatorBinaryUrl:
    Type: String
    NoEcho: true
  ShardBinaryUrl:
    Type: String
    NoEcho: true
  MonitoringConfigUrl:
    Type: String
    NoEcho: true
    Description: monitoring/ folder as tar.gz (Prometheus config, alerts, Grafana dashboard)
  ApiToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: Token for the /tables API, empty = no token needed
  ClientCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: Who can call the coordinator API (8080) and open Prometheus (9090) and Grafana (3000)
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small]
  WriteQuorum:
    Type: Number
    Default: 2
    AllowedValues: [1, 2, 3]
    Description: Default W, how many replicas must have a write
  ReadQuorum:
    Type: Number
    Default: 2
    AllowedValues: [1, 2, 3]
    Description: Default R, how many replicas a read asks
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  CoordinatorSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Coordinator - API on 8080
      VpcId:
        Fn::ImportValue: !Sub "${NetworkStackName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: !Ref ClientCidr

  ShardSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Shard replicas - 8081 only from the coordinator and other replicas
      VpcId:
        Fn::ImportValue: !Sub "${NetworkStackName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8081
          ToPort: 8081
          SourceSecurityGroupId: !Ref CoordinatorSecurityGroup

  ShardFromShards:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ShardSecurityGroup
      IpProtocol: tcp
      FromPort: 8081
      ToPort: 8081
      SourceSecurityGroupId: !Ref ShardSecurityGroup

  CoordinatorFromShards:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref CoordinatorSecurityGroup
      IpProtocol: tcp
      FromPort: 9080
      ToPort: 9080
      SourceSecurityGroupId: !Ref ShardSecurityGroup

  MonitoringSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Monitoring - Prometheus on 9090, Grafana on 3000
      VpcId:
        Fn::ImportValue: !Sub "${NetworkStackName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 9090
          ToPort: 9090
          CidrIp: !Ref ClientCidr
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: !Ref ClientCidr

  CoordinatorFromMonitoring:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref CoordinatorSecurityGroup
      IpProtocol: tcp
      FromPort: 9080
      ToPort: 9080
      SourceSecurityGroupId: !Ref MonitoringSecurityGroup

  ShardFromMonitoring:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ShardSecurityGroup
      IpProtocol: tcp
      FromPort: 8081
      ToPort: 8081
      SourceSecurityGroupId: !Ref MonitoringSecurityGroup

  Coordinator:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp2
            VolumeSize: 8
      SubnetId: !Select
        - 0
        - !Split
          - ","
          - Fn::ImportValue: !Sub "${NetworkStackName}-PublicSubnetIds"
      SecurityGroupIds:
        - !Ref CoordinatorSecurityGroup
      Tags:
        - Key: Name
          Value: coordinator
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eux
          curl -fsSL -o /usr/local/bin/coordinator "${CoordinatorBinaryUrl}"
          chmod +x /usr/local/bin/coordinator
          cat > /etc/systemd/system/coordinator.service <<EOT
          [Service]
          Environment=PORT=8080
          Environment=INTERNAL_PORT=9080
          Environment=W=${WriteQuorum}
          Environment=R=${ReadQuorum}
          Environment=EXPECTED_SHARDS=shard-1,shard-2
          Environment=DATA_DIR=/var/lib/kvcoord
          Environment=API_TOKEN=${ApiToken}
          ExecStart=/usr/local/bin/coordinator
          Restart=always
          LogRateLimitIntervalSec=0
          [Install]
          WantedBy=multi-user.target
          EOT
          systemctl enable --now coordinator

  Shard1A:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp2
            VolumeSize: 8
      SubnetId: !Select
        - 0
        - !Split
          - ","
          - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnetIds"
      SecurityGroupIds:
        - !Ref ShardSecurityGroup
      Tags:
        - Key: Name
          Value: shard-1-a
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eux
          curl -fsSL -o /usr/local/bin/shard "${ShardBinaryUrl}"
          chmod +x /usr/local/bin/shard
          TOKEN=$(curl -sX PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
          IP=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/local-ipv4)
          cat > /etc/systemd/system/shard.service <<EOT
          [Service]
          Environment=SHARD_ID=shard-1
          Environment=REPLICA_ID=shard-1-a
          Environment=ROLE=leader
          Environment=DATA_DIR=/var/lib/kvnode
          Environment=ADVERTISE_ADDR=http://$IP:8081
          Environment=COORDINATOR_URL=http://${Coordinator.PrivateIp}:9080
          ExecStart=/usr/local/bin/shard
          Restart=always
          LogRateLimitIntervalSec=0
          [Install]
          WantedBy=multi-user.target
          EOT
          systemctl enable --now shard

  Shard1B:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp2
            VolumeSize: 8
      SubnetId: !Select
        - 1
        - !Split
          - ","
          - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnetIds"
      SecurityGroupIds:
        - !Ref ShardSecurityGroup
      Tags:
        - Key: Name
          Value: shard-1-b
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eux
          curl -fsSL -o /usr/local/bin/shard "${ShardBinaryUrl}"
          chmod +x /usr/local/bin/shard
          TOKEN=$(curl -sX PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
          IP=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/local-ipv4)
          cat > /etc/systemd/system/shard.service <<EOT
          [Service]
          Environment=SHARD_ID=shard-1
          Environment=REPLICA_ID=shard-1-b
          Environment=ROLE=follower
          Environment=LEADER_URL=http://${Shard1A.PrivateIp}:8081
          Environment=DATA_DIR=/var/lib/kvnode
          Environment=ADVERTISE_ADDR=http://$IP:8081
          Environment=COORDINATOR_URL=http://${Coordinator.PrivateIp}:9080
          ExecStart=/usr/local/bin/shard
          Restart=always
          LogRateLimitIntervalSec=0
          [Install]
          WantedBy=multi-user.target
          EOT
          systemctl enable --now shard

  Shard1C:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp2
            VolumeSize: 8
      SubnetId: !Select
        - 0
        - !Split
          - ","
          - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnetIds"
      SecurityGroupIds:
        - !Ref ShardSecurityGroup
      Tags:
        - Key: Name
          Value: shard-1-c
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eux
          curl -fsSL -o /usr/local/bin/shard "${ShardBinaryUrl}"
          chmod +x /usr/local/bin/shard
          TOKEN=$(curl -sX PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
          IP=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/local-ipv4)
          cat > /etc/systemd/system/shard.service <<EOT
          [Service]
          Environment=SHARD_ID=shard-1
          Environment=REPLICA_ID=shard-1-c
          Environment=ROLE=follower
          Environment=LEADER_URL=http://${Shard1A.PrivateIp}:8081
          Environment=DATA_DIR=/var/lib/kvnode
          Environment=ADVERTISE_ADDR=http://$IP:8081
          Environment=COORDINATOR_URL=http://${Coordinator.PrivateIp}:9080
          ExecStart=/usr/local/bin/shard
          Restart=always
          LogRateLimitIntervalSec=0
          [Install]
          WantedBy=multi-user.target
          EOT
          systemctl enable --now shard

  Shard2A:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp2
            VolumeSize: 8
      SubnetId: !Select
        - 1
        - !Split
          - ","
          - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnetIds"
      SecurityGroupIds:
        - !Ref ShardSecurityGroup
      Tags:
        - Key: Name
          Value: shard-2-a
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eux
          curl -fsSL -o /usr/local/bin/shard "${ShardBinaryUrl}"
          chmod +x /usr/local/bin/shard
          TOKEN=$(curl -sX PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
          IP=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/local-ipv4)
          cat > /etc/systemd/system/shard.service <<EOT
          [Service]
          Environment=SHARD_ID=shard-2
          Environment=REPLICA_ID=shard-2-a
          Environment=ROLE=leader
          Environment=DATA_DIR=/var/lib/kvnode
          Environment=ADVERTISE_ADDR=http://$IP:8081
          Environment=COORDINATOR_URL=http://${Coordinator.PrivateIp}:9080
          ExecStart=/usr/local/bin/shard
          Restart=always
          LogRateLimitIntervalSec=0
          [Install]
          WantedBy=multi-user.target
          EOT
          systemctl enable --now shard

