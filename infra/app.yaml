          Restart=always
          LogRateLimitIntervalSec=0
          [Install]
          WantedBy=multi-user.target
          EOT
          systemctl enable --now shard

  Monitoring:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp2
            VolumeSize: 8
      SubnetId: !Select
        - 1
        - !Split
          - ","
          - Fn::ImportValue: !Sub "${NetworkStackName}-PublicSubnetIds"
      SecurityGroupIds:
        - !Ref MonitoringSecurityGroup
      Tags:
        - Key: Name
          Value: monitoring
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eux
          echo "${Coordinator.PrivateIp} coordinator" >> /etc/hosts
          echo "127.0.0.1 prometheus" >> /etc/hosts
          mkdir -p /opt/monitoring /opt/prometheus /opt/grafana /var/lib/prometheus /var/lib/grafana
          curl -fsSL "${MonitoringConfigUrl}" | tar -xz -C /opt/monitoring
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v2.53.3/prometheus-2.53.3.linux-amd64.tar.gz | tar -xz -C /opt/prometheus --strip-components=1
          curl -fsSL https://dl.grafana.com/oss/release/grafana-11.3.0.linux-amd64.tar.gz | tar -xz -C /opt/grafana --strip-components=1
          cat > /etc/systemd/system/prometheus.service <<EOT
          [Service]
          ExecStart=/opt/prometheus/prometheus --config.file=/opt/monitoring/prometheus.yml --storage.tsdb.path=/var/lib/prometheus --storage.tsdb.retention.time=3d
          Restart=always
          LogRateLimitIntervalSec=0
          [Install]
          WantedBy=multi-user.target
          EOT
          cat > /etc/systemd/system/grafana.service <<EOT
          [Service]
          WorkingDirectory=/opt/grafana
          Environment=GF_PATHS_PROVISIONING=/opt/monitoring/grafana/provisioning
          Environment=GF_PATHS_DATA=/var/lib/grafana
          Environment=GF_AUTH_ANONYMOUS_ENABLED=true
          Environment=GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
          Environment=GF_AUTH_DISABLE_LOGIN_FORM=true
          ExecStart=/opt/grafana/bin/grafana server --homepath /opt/grafana
          Restart=always
          LogRateLimitIntervalSec=0
          [Install]
          WantedBy=multi-user.target
          EOT
          systemctl enable --now prometheus grafana

Outputs:
  CoordinatorUrl:
    Value: !Sub "http://${Coordinator.PublicIp}:8080"
  PrometheusUrl:
    Value: !Sub "http://${Monitoring.PublicIp}:9090"
  GrafanaUrl:
    Value: !Sub "http://${Monitoring.PublicIp}:3000/d/kvstore"
