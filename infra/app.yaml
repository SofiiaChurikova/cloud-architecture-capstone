      SubnetId: !Select
        - 0
        - !Split
          - ","
          - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnetIds"
      SecurityGroupIds:
        - !Ref ShardSecurityGroup
      Tags:
        - Key: Name
          Value: shard-2-b
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eux
          curl -fsSL -o /usr/local/bin/shard "${ShardBinaryUrl}"
          chmod +x /usr/local/bin/shard
          TOKEN=$(curl -sX PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
          IP=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/local-ipv4)
          cat > /etc/systemd/system/shard.service <<EOT
          [Service]
          Environment=SHARD_ID=shard-2
          Environment=REPLICA_ID=shard-2-b
          Environment=ROLE=follower
          Environment=LEADER_URL=http://${Shard2A.PrivateIp}:8081
          Environment=DATA_DIR=/var/lib/kvnode
          Environment=ADVERTISE_ADDR=http://$IP:8081
          Environment=COORDINATOR_URL=http://${Coordinator.PrivateIp}:9080
          ExecStart=/usr/local/bin/shard
          Restart=always
          LogRateLimitIntervalSec=0
          [Install]
          WantedBy=multi-user.target
          EOT
          systemctl enable --now shard

  Shard2C:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp2
            VolumeSize: 8
      SubnetId: !Select
        - 1
        - !Split
          - ","
          - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnetIds"
      SecurityGroupIds:
        - !Ref ShardSecurityGroup
      Tags:
        - Key: Name
          Value: shard-2-c
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eux
          curl -fsSL -o /usr/local/bin/shard "${ShardBinaryUrl}"
          chmod +x /usr/local/bin/shard
          TOKEN=$(curl -sX PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
          IP=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/local-ipv4)
          cat > /etc/systemd/system/shard.service <<EOT
          [Service]
          Environment=SHARD_ID=shard-2
          Environment=REPLICA_ID=shard-2-c
          Environment=ROLE=follower
          Environment=LEADER_URL=http://${Shard2A.PrivateIp}:8081
          Environment=DATA_DIR=/var/lib/kvnode
          Environment=ADVERTISE_ADDR=http://$IP:8081
          Environment=COORDINATOR_URL=http://${Coordinator.PrivateIp}:9080
